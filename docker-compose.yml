# Scan Koillection — pile complète, sans aucun fichier annexe.
#
# Ce fichier se suffit à lui-même : il peut être collé tel quel dans l'interface
# Docker d'un NAS (UGREEN, Synology, QNAP…) qui ne permet pas de déposer un
# `.env` ou un `Caddyfile` à côté. Renseignez simplement les valeurs marquées
# « À RENSEIGNER » ci-dessous.
#
# Si vous préférez un fichier `.env` séparé, remplacez le bloc `environment:`
# par `env_file: [.env]` et reprenez le modèle commenté `.env.example`.

services:
  scan-koillection:
    # Épinglez une version (1.2.1, 1.2, 1…) plutôt que `latest` pour maîtriser
    # les mises à jour et pouvoir revenir en arrière.
    image: ghcr.io/zangets1/scan_koillection:latest
    container_name: scan-koillection
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # ── Koillection — À RENSEIGNER ──────────────────────────────────
      # URL vue depuis ce conteneur : l'IP du NAS et le port publié par
      # Koillection (pas 8080, qui est celui de cet outil).
      #
      # Pour utiliser plutôt le nom du conteneur (« http://koillection:80 »),
      # il faut que les deux partagent un réseau Docker : voir le bloc
      # « networks » en bas de ce fichier. Sans cela le nom reste introuvable,
      # chaque pile Compose créant son propre réseau isolé.
      KOILLECTION_URL: "http://192.168.1.10:81"
      KOILLECTION_USERNAME: "mon_utilisateur"
      KOILLECTION_PASSWORD: "mon_mot_de_passe"
      # Collection proposée par défaut : titre exact, chemin ou identifiant.
      KOILLECTION_DEFAULT_COLLECTION: "Livres"

      # ── Droits sur le dossier ./data ────────────────────────────────
      # Doivent correspondre au propriétaire du dossier côté NAS, sinon le
      # conteneur ne peut pas écrire son historique et refuse de démarrer.
      PUID: "1000"
      PGID: "1000"

      # ── Réglages courants (valeurs par défaut, à ajuster si besoin) ──
      # Mot de passe d'accès à l'interface. Vide = aucune authentification.
      APP_PASSWORD: ""
      # Indispensable si APP_PASSWORD est défini, sinon chaque redémarrage
      # déconnecte tout le monde. Générez-la : openssl rand -base64 32
      SESSION_SECRET: ""
      # Catalogues interrogés, dans l'ordre de priorité.
      PROVIDERS: "bnf,sudoc,openlibrary,openbd,googlebooks"
      # Plafond global d'une recherche, en secondes.
      LOOKUP_DEADLINE: "4"
      # Range chaque tome d'une série dans une sous-collection à son nom.
      SERIES_SUBCOLLECTIONS: "1"
      # Crée aussi les genres comme tags Koillection.
      GENRES_AS_TAGS: "1"
      # Téléverse la couverture trouvée comme image de l'item.
      UPLOAD_COVER: "1"
      TZ: "Europe/Paris"
    volumes:
      # Historique des ajouts (SQLite). Un simple dossier suffit.
      - ./data:/data
    # Décommentez pour rejoindre le réseau de Koillection (voir plus bas).
    # networks: [default, koillection]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ────────────────────────────────────────────────────────────────────
  # HTTPS local — indispensable : iOS et Android refusent l'accès à la
  # caméra sur une page en http://. Sans ce service, seule la saisie
  # manuelle de l'ISBN fonctionnera depuis un téléphone.
  #
  #   docker compose --profile https up -d
  #   puis https://ADRESSE_DU_NAS:8443
  #
  # Le certificat est auto-signé : le téléphone affiche un avertissement à
  # accepter une fois.
  # ────────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: scan-koillection-tls
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      # À RENSEIGNER : exactement l'adresse que vous taperez dans le
      # navigateur, IP ou nom d'hôte. Le certificat est émis pour elle.
      NAS_HOST: "192.168.1.10"
    # La configuration est écrite au démarrage plutôt que montée depuis un
    # fichier, pour que ce compose reste utilisable seul dans une interface de
    # NAS. `default_sni` est indispensable : un navigateur qui vise une adresse
    # IP n'envoie pas de SNI, et Caddy refuserait sinon la poignée de main.
    entrypoint: ["sh", "-c"]
    command:
      - |
        printf '%s\n' \
          '{' \
          "  default_sni $${NAS_HOST}" \
          '}' \
          "https://$${NAS_HOST}:8443 {" \
          '  tls internal' \
          '  encode gzip' \
          '  reverse_proxy scan-koillection:8080' \
          '}' > /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      # Conserve l'autorité de certification locale : sans cela, un
      # redémarrage régénère un certificat et le téléphone redemande à
      # l'utilisateur d'accepter l'avertissement.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - scan-koillection

volumes:
  caddy-data:
  caddy-config:

# ──────────────────────────────────────────────────────────────────────
# Joindre Koillection par son nom de conteneur
#
# Utile si Koillection tourne dans une autre pile Docker sur le même NAS.
# Repérez le nom de son réseau — il se termine généralement par « _default » :
#
#     docker network ls
#
# puis décommentez le bloc ci-dessous ainsi que la ligne « networks: » du
# service scan-koillection, et mettez KOILLECTION_URL à « http://koillection:80 »
# (le nom du service ou du conteneur Koillection, et son port interne).
# ──────────────────────────────────────────────────────────────────────
# networks:
#   koillection:
#     external: true
#     name: koillection_default
