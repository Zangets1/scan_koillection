name: Release

# Publie l'image multi-architecture (amd64 + arm64, pour les NAS ARM) et crée
# la release GitHub.
#
# Deux façons de déclencher :
#   • pousser un tag « vX.Y.Z »  →  git tag -a v1.1.0 -m "…" && git push origin v1.1.0
#   • Actions → Release → « Run workflow » en saisissant la version : le tag est
#     alors créé par le workflow lui-même.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (format vX.Y.Z)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Déterminer la version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Version invalide : « $VERSION » (attendu : vX.Y.Z)"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version publiée : $VERSION"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-') }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Le tag est créé ici s'il n'existe pas encore (cas du lancement manuel).
      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Installation

            ```yaml
            image: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            ```bash
            docker compose pull && docker compose up -d
            ```

            ## Revenir à cette version

            Si une mise à jour ultérieure pose problème, remplacez l'étiquette de l'image
            par `${{ steps.version.outputs.version }}` dans `docker-compose.yml` et relancez
            `docker compose up -d`. Le dossier `./data` reste compatible et aucune donnée
            Koillection n'est modifiée par un retour arrière.

            Le détail des changements figure dans le
            [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
